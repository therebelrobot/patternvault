server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Pi CPUs are not fast; compress once at the edge rather than shipping
  # 3MB of JS uncompressed over the LAN.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    application/wasm image/svg+xml;

  # Astro emits directories with index.html, not an SPA fallback.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Hashed filenames — safe to cache forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # tree-sitter wasm (haskell/tidal parsing). Some nginx mime.types builds
  # still lack this, and a wrong type breaks streaming compilation.
  location ~* \.wasm$ {
    types { }
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Audio samples and fonts: content-addressed by name, rarely change.
  location ~* \.(wav|mp3|ogg|flac|ttf|otf|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
  }

  # Service worker must revalidate or the app pins to an old build forever.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|manifest\.json)$ {
    add_header Cache-Control "no-cache, must-revalidate";
    expires off;
  }

  # api.github.com is called directly from the browser, so no proxying is
  # needed here. These headers just keep the page itself well-behaved.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
    default_type text/plain;
  }
}
